services:
  bot:
    build: .
    image: ghcr.io/jonathanbittan9-dotcom/docker-studying:latest
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?set DISCORD_TOKEN in .env}
      DATABASE_URL:  postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/botdb
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: botdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL" , "pg_isready -U postgres -d botdb"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:

